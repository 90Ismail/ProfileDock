<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4e"/>
      <stop offset="0.55" stop-color="#5b4bb7"/>
      <stop offset="1" stop-color="#e9887f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1020" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screen"><rect width="1280" height="720" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1280" height="720" fill="url(#wall)"/>
    <rect width="1280" height="720" fill="url(#glow)"/>

    <!-- Menu bar -->
    <rect width="1280" height="30" fill="#000" fill-opacity="0.18"/>
    <circle cx="26" cy="15" r="6" fill="#fff" fill-opacity="0.85"/>
    <text x="46" y="20" font-size="13" font-weight="700" fill="#fff">Browser</text>
    <text x="118" y="20" font-size="13" fill="#fff" fill-opacity="0.85" word-spacing="16">File Edit View History Profiles Window</text>
    <text x="1254" y="20" font-size="13" fill="#fff" fill-opacity="0.85" text-anchor="end">Tue 9:41 AM</text>

    <!-- Browser window (generic) -->
    <g filter="url(#shadow)">
      <rect x="80" y="62" width="700" height="470" rx="14" fill="#f5f6f8"/>
    </g>
    <path d="M80 76a14 14 0 0 1 14-14h672a14 14 0 0 1 14 14v34H80z" fill="#dfe3ea"/>
    <circle cx="102" cy="86" r="6.5" fill="#ff5f57"/>
    <circle cx="124" cy="86" r="6.5" fill="#febc2e"/>
    <circle cx="146" cy="86" r="6.5" fill="#28c840"/>
    <path d="M176 110v-22a8 8 0 0 1 8-8h196a8 8 0 0 1 8 8v22z" fill="#f5f6f8"/>
    <rect x="192" y="88" width="14" height="14" rx="4" fill="#1a3a6e"/>
    <text x="214" y="100" font-size="12" fill="#2b2f36">Q4 Planning — Docs</text>
    <text x="402" y="100" font-size="12" fill="#6b7280">Pull requests</text>
    <rect x="96" y="118" width="668" height="30" rx="15" fill="#e9ecf1"/>
    <text x="118" y="138" font-size="12" fill="#6b7280">docs.example.com/q4-planning</text>
    <rect x="96" y="160" width="668" height="356" rx="8" fill="#ffffff"/>
    <rect x="130" y="196" width="300" height="20" rx="5" fill="#1a3a6e" fill-opacity="0.85"/>
    <rect x="130" y="234" width="560" height="10" rx="5" fill="#d7dce4"/>
    <rect x="130" y="256" width="520" height="10" rx="5" fill="#d7dce4"/>
    <rect x="130" y="278" width="580" height="10" rx="5" fill="#d7dce4"/>
    <rect x="130" y="300" width="300" height="10" rx="5" fill="#d7dce4"/>
    <rect x="130" y="336" width="250" height="140" rx="10" fill="#e8eefb"/>
    <rect x="152" y="420" width="30" height="40" rx="3" fill="#3a8bc9"/>
    <rect x="192" y="390" width="30" height="70" rx="3" fill="#1a3a6e"/>
    <rect x="232" y="370" width="30" height="90" rx="3" fill="#228a5c"/>
    <rect x="272" y="400" width="30" height="60" rx="3" fill="#3a8bc9"/>
    <rect x="410" y="336" width="300" height="10" rx="5" fill="#d7dce4"/>
    <rect x="410" y="358" width="270" height="10" rx="5" fill="#d7dce4"/>
    <rect x="410" y="380" width="290" height="10" rx="5" fill="#d7dce4"/>
    <rect x="410" y="402" width="200" height="10" rx="5" fill="#d7dce4"/>

    <!-- Hover window list (above the Work icon) -->
    <g filter="url(#shadow)">
      <rect x="495" y="300" width="390" height="300" rx="16" fill="#f7f7f9" fill-opacity="0.97" stroke="#000" stroke-opacity="0.12"/>
    </g>
    <!-- header -->
    <rect x="511" y="316" width="28" height="28" rx="7" fill="#1a3a6e"/>
    <text x="525" y="336" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">W</text>
    <text x="551" y="336" font-size="17" font-weight="600" fill="#1d1d1f">Work</text>
    <text x="869" y="335" font-size="14" fill="#86868b" text-anchor="end">3 windows · 14 tabs</text>
    <rect x="495" y="358" width="390" height="1" fill="#000" fill-opacity="0.1"/>

    <!-- row 1: current -->
    <rect x="516" y="377" width="20" height="20" rx="5" fill="#4285f4"/>
    <rect x="521" y="382" width="10" height="2.5" rx="1" fill="#fff"/>
    <rect x="521" y="387" width="10" height="2.5" rx="1" fill="#fff"/>
    <rect x="521" y="392" width="7" height="2.5" rx="1" fill="#fff"/>
    <text x="548" y="388" font-size="16" fill="#1d1d1f">Q4 Planning — Docs</text>
    <text x="548" y="408" font-size="13"><tspan fill="#0a6cff" font-weight="600">Current</tspan><tspan fill="#aeaeb2"> · </tspan><tspan fill="#86868b">docs.example.com</tspan><tspan fill="#aeaeb2"> · </tspan><tspan fill="#86868b">6 tabs</tspan></text>

    <!-- row 2: hovered -->
    <rect x="503" y="422" width="374" height="58" rx="10" fill="#000" fill-opacity="0.07"/>
    <circle cx="526" cy="445" r="10" fill="#24292f"/>
    <circle cx="526" cy="445" r="4" fill="#fff"/>
    <text x="548" y="446" font-size="16" fill="#1d1d1f">Pull requests · acme/web</text>
    <text x="548" y="466" font-size="13"><tspan fill="#86868b">code.example.com</tspan><tspan fill="#aeaeb2"> · </tspan><tspan fill="#86868b">5 tabs</tspan></text>
    <circle cx="851" cy="451" r="13" fill="#000" fill-opacity="0.1"/>
    <path d="M846 446l10 10M856 446l-10 10" stroke="#55565c" stroke-width="2.2" stroke-linecap="round"/>

    <!-- row 3: minimized -->
    <g opacity="0.5">
      <rect x="516" y="493" width="20" height="20" rx="5" fill="#111"/>
      <text x="526" y="508" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">N</text>
    </g>
    <text x="548" y="504" font-size="16" fill="#1d1d1f">Team standup notes</text>
    <text x="548" y="524" font-size="13"><tspan fill="#86868b">Minimized</tspan><tspan fill="#aeaeb2"> · </tspan><tspan fill="#86868b">notes.example.com</tspan><tspan fill="#aeaeb2"> · </tspan><tspan fill="#86868b">3 tabs</tspan></text>

    <rect x="495" y="544" width="390" height="1" fill="#000" fill-opacity="0.1"/>
    <path d="M526 564v16M518 572h16" stroke="#6e6e73" stroke-width="2.2" stroke-linecap="round"/>
    <text x="548" y="578" font-size="16" fill="#1d1d1f">New Window</text>

    <!-- Dock -->
    <g filter="url(#soft)">
      <rect x="360" y="610" width="560" height="92" rx="24" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.45"/>
    </g>
    <!-- generic apps -->
    <rect x="380" y="620" width="72" height="72" rx="17" fill="#e8ebf0"/>
    <rect x="396" y="642" width="40" height="30" rx="5" fill="#5aa9f0"/>
    <path d="M396 648h18l4-6h18" stroke="#3b8de0" stroke-width="3" fill="none"/>
    <rect x="466" y="620" width="72" height="72" rx="17" fill="#2b2f3a"/>
    <path d="M484 645l12 10-12 10" stroke="#7CFC9A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="502" y="663" width="18" height="4" rx="2" fill="#7CFC9A"/>
    <rect x="552" y="620" width="72" height="72" rx="17" fill="#fbd75b"/>
    <rect x="566" y="638" width="44" height="5" rx="2.5" fill="#fff" fill-opacity="0.9"/>
    <rect x="566" y="650" width="44" height="5" rx="2.5" fill="#fff" fill-opacity="0.9"/>
    <rect x="566" y="662" width="30" height="5" rx="2.5" fill="#fff" fill-opacity="0.9"/>
    <rect x="637" y="626" width="2" height="60" rx="1" fill="#fff" fill-opacity="0.5"/>

    <!-- profile icons -->
    <g>
      <rect x="650" y="606" width="80" height="80" rx="19" fill="#1a3a6e"/>
      <text x="690" y="656" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">W</text>
      <text x="690" y="678" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.5">WORK</text>
      <circle cx="690" cy="696" r="2.5" fill="#fff"/>
    </g>
    <g>
      <rect x="740" y="620" width="72" height="72" rx="17" fill="#3a8bc9"/>
      <text x="776" y="664" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">S</text>
      <text x="776" y="684" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.5">SCHOOL</text>
      <circle cx="776" cy="698" r="2.5" fill="#fff"/>
    </g>
    <g>
      <rect x="826" y="620" width="72" height="72" rx="17" fill="#228a5c"/>
      <text x="862" y="664" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">P</text>
      <text x="862" y="684" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.5">PERSONAL</text>
      <circle cx="862" cy="698" r="2.5" fill="#fff"/>
    </g>

    <!-- pointer on the hovered row -->
    <path d="M790 452l0 26 6.5-6 4.5 10 4.2-1.9-4.4-9.8 8.8-0.3z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- callouts -->
    <g font-size="15" font-weight="600" fill="#fff">
      <rect x="930" y="340" width="300" height="88" rx="14" fill="#000" fill-opacity="0.28"/>
      <text x="950" y="372">Hover a profile icon</text>
      <text x="950" y="396" font-weight="400" fill-opacity="0.85">See every window in that profile,</text>
      <text x="950" y="416" font-weight="400" fill-opacity="0.85">with its site and tab count.</text>
      <path d="M930 384h-36" stroke="#fff" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="4 4"/>
      <rect x="950" y="556" width="280" height="88" rx="14" fill="#000" fill-opacity="0.28"/>
      <text x="970" y="588">One Dock icon per profile</text>
      <text x="970" y="612" font-weight="400" fill-opacity="0.85">Click to jump straight to it —</text>
      <text x="970" y="632" font-weight="400" fill-opacity="0.85">no "Who's using Chrome?" picker.</text>
      <path d="M950 610h-44" stroke="#fff" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="4 4"/>
    </g>
  </g>
</svg>
