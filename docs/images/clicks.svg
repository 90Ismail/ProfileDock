<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2a4e" flood-opacity="0.14"/>
    </filter>
    <g id="win">
      <rect width="120" height="80" rx="8" fill="#fff" stroke="#d5dae3"/>
      <path d="M0 8a8 8 0 0 1 8-8h104a8 8 0 0 1 8 8v12H0z" fill="#e3e7ee"/>
      <circle cx="10" cy="10" r="3" fill="#ff5f57"/><circle cx="20" cy="10" r="3" fill="#febc2e"/><circle cx="30" cy="10" r="3" fill="#28c840"/>
      <rect x="12" y="32" width="70" height="7" rx="3.5" fill="#d7dce4"/>
      <rect x="12" y="46" width="94" height="7" rx="3.5" fill="#d7dce4"/>
      <rect x="12" y="60" width="54" height="7" rx="3.5" fill="#d7dce4"/>
    </g>
    <g id="work">
      <rect width="64" height="64" rx="15" fill="#1a3a6e"/>
      <text x="32" y="40" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">W</text>
      <text x="32" y="56" font-size="8" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.4">WORK</text>
    </g>
    <path id="cursor" d="M0 0v22l5.5-5 3.8 8.6 3.6-1.6-3.8-8.4 7.5-.3z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#f4f6fb"/>

  <!-- Card 1 -->
  <g filter="url(#card)"><rect x="30" y="30" width="360" height="320" rx="18" fill="#fff"/></g>
  <rect x="54" y="54" width="34" height="34" rx="17" fill="#1a3a6e"/>
  <text x="71" y="77" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="102" y="68" font-size="17" font-weight="700" fill="#1d1d1f">No windows open</text>
  <text x="102" y="88" font-size="14" fill="#6e6e73">Click the icon…</text>
  <use href="#work" x="62" y="160"/>
  <g transform="translate(108 196)"><use href="#cursor"/></g>
  <circle cx="108" cy="196" r="16" fill="none" stroke="#0a6cff" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M150 192h52" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(222 152)"><use href="#win"/></g>
  <rect x="222" y="152" width="120" height="80" rx="8" fill="none" stroke="#0a6cff" stroke-width="2.5"/>
  <text x="54" y="292" font-size="16" font-weight="600" fill="#1d1d1f">…and a new window opens</text>
  <text x="54" y="316" font-size="14" fill="#6e6e73">in that profile. No profile picker.</text>

  <!-- Card 2 -->
  <g filter="url(#card)"><rect x="420" y="30" width="360" height="320" rx="18" fill="#fff"/></g>
  <rect x="444" y="54" width="34" height="34" rx="17" fill="#1a3a6e"/>
  <text x="461" y="77" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="492" y="68" font-size="17" font-weight="700" fill="#1d1d1f">Another app is in front</text>
  <text x="492" y="88" font-size="14" fill="#6e6e73">Click the icon…</text>
  <use href="#work" x="452" y="160"/>
  <g transform="translate(498 196)"><use href="#cursor"/></g>
  <circle cx="498" cy="196" r="16" fill="none" stroke="#0a6cff" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M540 192h52" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(632 140)" opacity="0.45"><use href="#win"/></g>
  <g transform="translate(612 160)"><use href="#win"/></g>
  <rect x="612" y="160" width="120" height="80" rx="8" fill="none" stroke="#0a6cff" stroke-width="2.5"/>
  <text x="444" y="292" font-size="16" font-weight="600" fill="#1d1d1f">…and your last-used window</text>
  <text x="444" y="316" font-size="14" fill="#6e6e73">in that profile comes forward.</text>

  <!-- Card 3 -->
  <g filter="url(#card)"><rect x="810" y="30" width="360" height="320" rx="18" fill="#fff"/></g>
  <rect x="834" y="54" width="34" height="34" rx="17" fill="#1a3a6e"/>
  <text x="851" y="77" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="882" y="68" font-size="17" font-weight="700" fill="#1d1d1f">That profile is in front</text>
  <text x="882" y="88" font-size="14" fill="#6e6e73">Click again…</text>
  <use href="#work" x="842" y="160"/>
  <g transform="translate(888 196)"><use href="#cursor"/></g>
  <circle cx="888" cy="196" r="16" fill="none" stroke="#0a6cff" stroke-width="2" stroke-opacity="0.5"/>
  <g transform="translate(1000 148) scale(0.62)"><use href="#win"/></g>
  <g transform="translate(1072 148) scale(0.62)"><use href="#win"/></g>
  <g transform="translate(1036 206) scale(0.62)"><use href="#win"/></g>
  <rect x="1072" y="148" width="74.4" height="49.6" rx="5" fill="none" stroke="#0a6cff" stroke-width="2.5"/>
  <path d="M1078 202 q 8 12 -6 22" stroke="#8a93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1032 236 q -22 -4 -22 -28" stroke="#8a93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1040 166 h 24" stroke="#8a93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M928 192h52" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="834" y="292" font-size="16" font-weight="600" fill="#1d1d1f">…to step through its windows</text>
  <text x="834" y="316" font-size="14" fill="#6e6e73">one by one, so you can visit them all.</text>
</svg>
