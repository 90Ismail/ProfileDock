<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4e"/>
      <stop offset="0.6" stop-color="#5b4bb7"/>
      <stop offset="1" stop-color="#e9887f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1020" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#wall)"/>

  <g filter="url(#shadow)">
    <rect x="124" y="80" width="952" height="214" rx="26" fill="#2a2b33" fill-opacity="0.82" stroke="#fff" stroke-opacity="0.12"/>
  </g>

  <!-- tile 1: selected -->
  <rect x="148" y="102" width="174" height="170" rx="16" fill="#fff" fill-opacity="0.18"/>
  <g font-size="12">
    <rect x="193" y="118" width="84" height="84" rx="20" fill="#1a3a6e"/>
    <text x="235" y="168" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">W</text>
    <text x="235" y="190" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">WORK</text>
    <text x="235" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Work</text>
    <text x="235" y="246" fill="#fff" fill-opacity="0.75" text-anchor="middle">Q4 Planning — Docs</text>
  </g>
  <!-- tile 2 -->
  <rect x="337" y="102" width="174" height="170" rx="16" fill="#fff" fill-opacity="0"/>
  <rect x="382" y="118" width="84" height="84" rx="20" fill="#1a3a6e"/>
  <text x="424" y="168" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">W</text>
  <text x="424" y="190" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">WORK</text>
  <text x="424" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Work</text>
  <text x="424" y="246" font-size="12" fill="#fff" fill-opacity="0.75" text-anchor="middle">Pull requests · acme/web</text>
  <!-- tile 3 -->
  <rect x="571" y="118" width="84" height="84" rx="20" fill="#3a8bc9"/>
  <text x="613" y="168" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">S</text>
  <text x="613" y="190" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">SCHOOL</text>
  <text x="613" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">School</text>
  <text x="613" y="246" font-size="12" fill="#fff" fill-opacity="0.75" text-anchor="middle">Problem Set 4</text>
  <!-- tile 4 -->
  <rect x="760" y="118" width="84" height="84" rx="20" fill="#228a5c"/>
  <text x="802" y="168" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">P</text>
  <text x="802" y="190" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">PERSONAL</text>
  <text x="802" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Personal</text>
  <text x="802" y="246" font-size="12" fill="#fff" fill-opacity="0.75" text-anchor="middle">Weekend trip ideas</text>
  <!-- tile 5: generic notes app -->
  <rect x="949" y="118" width="84" height="84" rx="20" fill="#fbd75b"/>
  <rect x="965" y="140" width="52" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <rect x="965" y="156" width="52" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <rect x="965" y="172" width="34" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="991" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Notes</text>
  <text x="991" y="246" font-size="12" fill="#fff" fill-opacity="0.75" text-anchor="middle">Grocery list</text>

  <!-- keys -->
  <g font-size="18" font-weight="600" fill="#fff">
    <rect x="452" y="336" width="120" height="50" rx="10" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
    <text x="512" y="368" text-anchor="middle">⌥ Option</text>
    <text x="600" y="368" text-anchor="middle" font-weight="400" fill-opacity="0.8">+</text>
    <rect x="628" y="336" width="120" height="50" rx="10" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
    <text x="688" y="368" text-anchor="middle">⇥ Tab</text>
  </g>
  <text x="600" y="420" font-size="14" fill="#fff" fill-opacity="0.8" text-anchor="middle">Every window, every app — each profile shown with its own icon.</text>
</svg>
