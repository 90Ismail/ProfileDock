<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --muted: #6e6e73; --ok: #28a745; --wait: #d18b00; }
  @media (prefers-color-scheme: dark) { :root { --muted: #a1a1a6; --ok: #34c759; --wait: #ffb340; } }
  body { font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 270px; margin: 0; padding: 14px 16px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; }
  .dot.ok { background: var(--ok); }
  p { margin: 10px 0 0; color: var(--muted); }
</style>
</head>
<body>
  <h1 id="title">ProfileDock</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  <p>Click this profile’s Dock icon to switch to its windows, or hover it to pick one. Window titles stay on this Mac.</p>
  <script src="popup.js"></script>
</body>
</html>
